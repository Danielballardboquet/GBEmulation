<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Game Boy style icon -->
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0C0C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9BBC0F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#306230;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Body -->
  <rect x="32" y="16" width="192" height="224" rx="16" ry="16" fill="url(#bodyGrad)" stroke="#808080" stroke-width="2"/>
  
  <!-- Screen bezel -->
  <rect x="48" y="32" width="160" height="128" rx="8" ry="8" fill="#404040"/>
  
  <!-- Screen -->
  <rect x="56" y="40" width="144" height="112" fill="url(#screenGrad)"/>
  
  <!-- Screen pixels effect -->
  <rect x="64" y="48" width="32" height="32" fill="#8BAC0F" opacity="0.8"/>
  <rect x="104" y="56" width="24" height="24" fill="#8BAC0F" opacity="0.6"/>
  <rect x="136" y="64" width="16" height="16" fill="#8BAC0F" opacity="0.4"/>
  
  <!-- D-pad -->
  <g transform="translate(72, 180)">
    <!-- Horizontal bar -->
    <rect x="8" y="16" width="32" height="16" rx="2" fill="#606060"/>
    <!-- Vertical bar -->
    <rect x="16" y="8" width="16" height="32" rx="2" fill="#606060"/>
    <!-- Center -->
    <circle cx="24" cy="24" r="6" fill="#404040"/>
  </g>
  
  <!-- A button -->
  <circle cx="168" cy="196" r="14" fill="#A02020" stroke="#802020" stroke-width="2"/>
  <text x="168" y="202" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">A</text>
  
  <!-- B button -->
  <circle cx="136" cy="208" r="14" fill="#A02020" stroke="#802020" stroke-width="2"/>
  <text x="136" y="214" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">B</text>
  
  <!-- Start/Select -->
  <ellipse cx="112" cy="224" rx="16" ry="6" fill="#404040"/>
  <ellipse cx="144" cy="224" rx="16" ry="6" fill="#404040"/>
</svg>
